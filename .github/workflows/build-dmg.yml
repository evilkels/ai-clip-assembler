name: Build macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-dmg:
    name: Build DMG on macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 runs on Apple Silicon; macos-15-intel is GitHub's
          # x64 runner (macos-13 was retired in December 2025). Pinned to
          # macOS 15 on both arches instead of macos-latest, which is
          # migrating to macOS 26 as of June 2026.
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # v0.1.1 and v0.1.3 both shipped DMGs that still reported 0.1.0, which
      # makes the in-app update check inert. Fail the build instead.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version=$(node -p "require('./frontend/package.json').version")
          backend_version=$(sed -n 's/^APP_VERSION = "\(.*\)"$/\1/p' backend/src/api.py)
          echo "tag=${tag_version} frontend=${package_version} backend=${backend_version}"
          if [ "${tag_version}" != "${package_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match frontend/package.json version ${package_version}. Bump the version before tagging." >&2
            exit 1
          fi
          if [ "${tag_version}" != "${backend_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match APP_VERSION ${backend_version} in backend/src/api.py." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install vetted FFmpeg runtime tools
        run: |
          brew tap homebrew-ffmpeg/ffmpeg
          brew install homebrew-ffmpeg/ffmpeg/ffmpeg --with-libvidstab
          ffmpeg -hide_banner -filters | grep vidstabdetect

      - name: Stage self-contained FFmpeg runtime tools
        working-directory: frontend
        env:
          CLIP_ASSEMBLER_FFMPEG_BIN: ${{ matrix.arch == 'arm64' && '/opt/homebrew/bin/ffmpeg' || '/usr/local/bin/ffmpeg' }}
        run: npm run stage:runtime-tools

      - name: Build packaged backend
        working-directory: frontend
        run: npm run build:backend

      # npm run build runs check:types-fresh, which regenerates TypeScript
      # types from the backend Pydantic models via backend/.venv.
      - name: Set up backend venv for type generation
        working-directory: backend
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Build frontend bundle
        working-directory: frontend
        env:
          CLIP_ASSEMBLER_FFMPEG_BIN: ${{ matrix.arch == 'arm64' && '/opt/homebrew/bin/ffmpeg' || '/usr/local/bin/ffmpeg' }}
        run: npm run build

      - name: Package DMG with electron-builder
        working-directory: frontend
        env:
          # CSC_LINK and CSC_KEY_PASSWORD can be added later for code signing.
          # Without them, electron-builder produces an unsigned DMG that macOS
          # Gatekeeper will warn on first open.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac dmg --publish never

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-clip-assembler-dmg-${{ matrix.arch }}
          path: frontend/dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      # Publish each architecture as soon as its build completes. A downstream
      # matrix join made the faster arm64 DMG wait for the slower x64 build.
      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: frontend/dist/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
